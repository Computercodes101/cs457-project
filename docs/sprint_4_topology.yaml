          # this is a shell script which will be sourced at boot
          hostname Client1
          # configurable user account
          USERNAME=cisco
          PASSWORD=cisco

          # On Client 1 and Client 2 Consoles (Alpine Linux):
          ip link set eth0 up
          udhcpc -i eth0

          # Install git on Alpine Linux (after Section 2.5 External Connector & R1 NAT are configured):
          apk update
          apk add git
          sync   # Flush disk writes so installed packages and files persist
