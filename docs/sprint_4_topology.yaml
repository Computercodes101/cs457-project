          # configurable user account
          USERNAME=cisco
          PASSWORD=cisco

          # On Game Server Node Console (Alpine or Ubuntu Linux):
          ip addr add 192.168.20.100/24 dev eth0
          ip link set eth0 up
          ip route add default via 192.168.20.1
          echo "nameserver 192.168.20.1" | tee /etc/resolv.conf

          # Install git on Alpine Linux (after Section 2.5 External Connector & R1 NAT are configured):
          apk update
          apk add git
          sync   # Flush disk writes so installed packages and files persist
