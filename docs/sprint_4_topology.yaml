nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1

          ! Enable IPv4 unicast routing across router interfaces:
          ip routing

          ! Configure Gi0/1 as the Default Gateway for Subnet A (Client 1):
          interface GigabitEthernet0/1
           ip address 192.168.10.1 255.255.255.0
           no shutdown
           exit

          ! Configure Gi0/2 as the Default Gateway for Subnet B (Client 2):
          interface GigabitEthernet0/2
           ip address 192.168.11.1 255.255.255.0
           no shutdown
           exit

          ! Configure Gi0/3 as the Default Gateway for Subnet C (Game Server):
          interface GigabitEthernet0/3
           ip address 192.168.20.1 255.255.255.0
           no shutdown
           exit

          ! Exclude router gateway IP addresses so R1 never assigns them to a client
          ip dhcp excluded-address 192.168.10.1
          ip dhcp excluded-address 192.168.11.1

          ! DHCP Pool for Client 1 (Subnet A - 192.168.10.0/24)
          ip dhcp pool CLIENT1_POOL
           network 192.168.10.0 255.255.255.0
           default-router 192.168.10.1
           dns-server 192.168.10.1
           exit

          ! DHCP Pool for Client 2 (Subnet B - 192.168.11.0/24)
          ip dhcp pool CLIENT2_POOL
           network 192.168.11.0 255.255.255.0
           default-router 192.168.11.1
           dns-server 192.168.11.1
           exit

          ! Enable the Cisco IOS DNS server responder on UDP/TCP port 53:
          ip domain lookup
          ip dns server

          ! Add a static Authoritative A-Record mapping your server FQDN to 192.168.20.100:
          ! (Replace [yourlastname] with your actual last name, e.g., server.smith.edu)
          ip host server.kispert.edu 192.168.20.100

          ! Configure Gi0/0 (connected to External Connector) via DHCP as NAT outside:
          interface GigabitEthernet0/0
           ip address dhcp
           ip nat outside
           no shutdown
           exit

          ! Mark internal LAN interfaces as NAT inside:
          interface GigabitEthernet0/1
           ip nat inside
           exit

          interface GigabitEthernet0/2
           ip nat inside
           exit

          interface GigabitEthernet0/3
           ip nat inside
           exit

          ! Permit all three internal subnets for NAT overload (PAT) out Gi0/0:
          access-list 1 permit 192.168.10.0 0.0.0.255
          access-list 1 permit 192.168.11.0 0.0.0.255
          access-list 1 permit 192.168.20.0 0.0.0.255
          ip nat inside source list 1 interface GigabitEthernet0/0 overload
